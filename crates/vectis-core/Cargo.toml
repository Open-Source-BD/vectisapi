[package]
name = "vectis-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
base64 = "0.23.1"
bytes = "1.12.1"
cookie_store = { version = "0.22.1", default-features = false, features = ["serde_json"] }
dashmap = "6.2.1"
futures-util = "0.3.34"
mime_guess = "2.0.5"
parking_lot = "0.13.0"
psl = "2.1.250"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2", "gzip", "brotli", "deflate", "zstd", "stream", "multipart", "socks"] }
rustls = { version = "0.23", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["fs", "macros", "rt-multi-thread", "time"] }
tokio-util = { version = "0.7.20", features = ["io"] }
url = "2.5.8"
uuid = { version = "1.29.2", features = ["v4"] }

[dev-dependencies]
axum = { version = "0.8.9", features = ["multipart"] }
axum-server = { version = "0.9.1", features = ["tls-rustls"] }
brotli = "9.1.1"
flate2 = "1.1.11"
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs", "pem"] }
tempfile = "3.27.0"
zstd = "0.14.3"
