[package]
name = "vectisapi"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "VectisAPI - offline desktop API client"

[lib]
name = "vectisapi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
parking_lot = "0.13.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-dialog = "2.8.4"
tauri-plugin-opener = "2.7.3"
tauri-plugin-window-state = "2.5.0"
tokio = { version = "1.54.1", features = ["fs", "sync", "time"] }
vectis-core = { path = "../crates/vectis-core" }
zip = { version = "9.5.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
axum = "0.8.9"
tauri = { version = "2.12.5", features = ["test"] }
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread"] }
url = "2.5.8"
