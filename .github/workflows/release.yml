name: Release

# Tag-only: a manual run would create a draft release named after the branch.
on:
  push:
    tags: ['v*']

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest # dmg + .app (universal: Apple silicon + Intel)
            args: --target universal-apple-darwin
          - platform: windows-latest # msi + nsis
            args: ''
          - platform: ubuntu-22.04 # AppImage + deb
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2

      - run: npm ci

      # Unsigned builds: no Apple / Windows signing secrets are configured.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'VectisAPI ${{ github.ref_name }}'
          releaseBody: 'Unsigned builds. See README for install notes (macOS: right-click → Open the first time).'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
